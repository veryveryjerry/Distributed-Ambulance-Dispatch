# ansible/inventory.ini
# ─────────────────────────────────────────────────────────────────────────────
# Ansible Inventory
#
# Replace the placeholder IP addresses with the actual IP addresses (or
# hostnames) of your target servers before running the playbook.
#
# The [ambulance_nodes] group targets machines that will run the Ambulance
# Docker containers.  The [hospital] group targets the machine that will run
# the Hospital Service container.
#
# Usage:
#   ansible-playbook -i inventory.ini setup.yml
# ─────────────────────────────────────────────────────────────────────────────

[ambulance_nodes]
ambulance-server-1  ansible_host=192.168.1.101  ansible_user=ubuntu
ambulance-server-2  ansible_host=192.168.1.102  ansible_user=ubuntu
ambulance-server-3  ansible_host=192.168.1.103  ansible_user=ubuntu

[hospital]
hospital-server     ansible_host=192.168.1.104  ansible_user=ubuntu

[all:vars]
# Path to a private SSH key that has access to all hosts (optional).
# ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
