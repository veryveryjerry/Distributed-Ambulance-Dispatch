name: CI/CD — Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Single source of truth: only push images on push->main
    env:
      IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Secrets are often unavailable on PRs (especially forks).
      # Only login when we're actually pushing.
      - name: Log in to Docker Hub
        if: ${{ env.IS_MAIN_PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main) ambulance-node
        uses: docker/build-push-action@v5
        with:
          context: ./ambulance_node
          push: ${{ env.IS_MAIN_PUSH == 'true' }}
          tags: |
            ${{ (env.IS_MAIN_PUSH == 'true') && format('{0}/ambulance-node:latest', secrets.DOCKERHUB_USERNAME) || 'ambulance-node:pr' }}
            ${{ (env.IS_MAIN_PUSH == 'true') && format('{0}/ambulance-node:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('ambulance-node:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (and push on main) hospital-service
        uses: docker/build-push-action@v5
        with:
          context: ./hospital_service
          push: ${{ env.IS_MAIN_PUSH == 'true' }}
          tags: |
            ${{ (env.IS_MAIN_PUSH == 'true') && format('{0}/hospital-service:latest', secrets.DOCKERHUB_USERNAME) || 'hospital-service:pr' }}
            ${{ (env.IS_MAIN_PUSH == 'true') && format('{0}/hospital-service:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('hospital-service:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
