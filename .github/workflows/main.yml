# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/main.yml — CI/CD Pipeline
#
# Triggers
# --------
#   • Push to the `main` branch
#   • Pull requests targeting `main`
#
# Steps
# -----
#   1. Checkout repository.
#   2. Set up Docker Buildx (multi-platform builds).
#   3. Log in to Docker Hub using repository secrets:
#        DOCKERHUB_USERNAME  — your Docker Hub username
#        DOCKERHUB_TOKEN     — a Docker Hub access token (not your password)
#   4. Build and push the ambulance-node image.
#   5. Build and push the hospital-service image.
#
# Required Secrets (set in Settings → Secrets and variables → Actions)
# ─────────────────────────────────────────────────────────────────────
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Build & Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Docker Buildx ────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Build and push ambulance-node ────────────────────────────────────
      - name: Build and push ambulance-node
        uses: docker/build-push-action@v5
        with:
          context: ./ambulance_node
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ambulance-node:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ambulance-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Build and push hospital-service ──────────────────────────────────
      - name: Build and push hospital-service
        uses: docker/build-push-action@v5
        with:
          context: ./hospital_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
